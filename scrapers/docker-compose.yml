services:
  mongodb:
    image: mongo:7.0
    container_name: academic_research_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      # Eğer authentication istiyorsanız bu satırları aktifleştirin
      # MONGO_INITDB_ROOT_USERNAME: admin
      # MONGO_INITDB_ROOT_PASSWORD: your_secure_password
      MONGO_INITDB_DATABASE: academic_research
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      # İlk başlatmada çalışacak init scriptleri
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - academic_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache Server
  redis:
    image: redis:7.4-alpine
    container_name: academic_research_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 300 1
      --save 60 100
    volumes:
      - redis_data:/data
    networks:
      - academic_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Commander - Web UI (opsiyonel - geliştirme için)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: academic_research_redis_commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - academic_network

  # MongoDB Web UI (opsiyonel - geliştirme için)
  mongo-express:
    image: mongo-express:latest
    container_name: academic_research_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      # Authentication aktifse bunları da ayarlayın
      # ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      # ME_CONFIG_MONGODB_ADMINPASSWORD: your_secure_password
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - academic_network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  academic_network:
    driver: bridge
